<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Полностью убираем любые отступы и скроллбары, чтобы размер соответствовал картинке */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            height: 100vh;
        }
        
        .btn-img {
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
            display: block;
            max-width: 250px;
            width: 100%;
            height: auto;
            border-radius: 12px;
        }

        /* Эффект при наведении */
        .btn-img:hover {
            transform: scale(1.05);
            filter: brightness(1.15) drop-shadow(0 10px 20px rgba(0,0,0,0.15)) drop-shadow(0 0 12px rgba(234, 179, 8, 0.65));
        }

        /* Эффект при нажатии */
        .btn-img:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Ссылка ведет строго на симулятор эластичности бананов в репозитории Microeconomics -->
    <a href="https://ogaydv-prog.github.io/Microeconomics/sim-elasticity-banana3.html" target="_blank">
        <img src="pic-sim-banana-elasticity3.png" 
             alt="Симулятор эластичности (Бананы)" 
             class="btn-img"
             draggable="false"
             onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/ogaydv-prog/Microeconomics/master/pic-sim-banana-elasticity3.png';">
    </a>

</body>
</html>
