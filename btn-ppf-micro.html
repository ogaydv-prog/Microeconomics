<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  /* Единый класс интерактивной плитки для всех кнопок */
  .interactive-tile {
    display: inline-block;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1), filter 0.25s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  
  .interactive-tile:hover {
    transform: scale(1.05);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)) drop-shadow(0 0 12px rgba(56, 189, 248, 0.65));
  }
  
  .interactive-tile:active {
    transform: scale(0.98);
  }
  
  /* Фиксированный максимальный размер 220px, идентичный кнопке NPV */
  .tile-img {
    width: 100%;
    max-width: 220px;
    height: auto;
    display: block;
    border-radius: 12px;
  }
</style>
</head>
<body>

  <!-- Ссылка на симулятор ППВ в репозитории Microeconomics с единым классом -->
  <a href="sim-ppf-micro.html" target="_blank" class="interactive-tile">
    
    <img src="pic-ppf-micro.png" 
         class="tile-img" 
         alt="Запустить симулятор ППВ" 
         draggable="false" 
         onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/ogaydv-prog/Microeconomics/master/pic-ppf-micro.png';">
         
  </a>

</body>
</html>
