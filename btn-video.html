<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  
  /* Единый контейнер-кнопка по аналогии с маржинальным анализом */
  .main-tile-btn {
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    display: inline-block;
    perspective: 1000px;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    width: 100%;
    max-width: 250px;
    height: auto;
  }

  .tile-card {
    width: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .main-tile-btn.flipped .tile-card {
    transform: rotateY(180deg);
  }

  .front, .back {
    width: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    box-sizing: border-box;
  }

  .front {
    background: transparent;
    overflow: hidden;
  }

  .front img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    transition: transform 0.25s ease, filter 0.25s ease;
  }

  .main-tile-btn:not(.flipped):hover .front img {
    transform: scale(1.03);
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)) drop-shadow(0 0 12px rgba(244, 67, 54, 0.65));
  }

  .back {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: #ffffff;
    border: 2px solid #cc1818;
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8px;
    border-radius: 12px;
  }

  .back a {
    color: #333333;
    text-decoration: none;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 8px;
    margin: 2px 0;
    border-radius: 6px;
    background: #f9f9f9;
    border-bottom: 1px solid #eee;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .back a:hover {
    background: #ffebee;
    color: #cc1818;
  }
</style>
</head>
<body>

  <!-- Кликабельная карточка с переворотом для видео -->
  <div class="main-tile-btn" id="videoTile">
    <div class="tile-card">
      <div class="front">
        <img src="pic-video.png" 
             alt="Видеоматериалы" 
             draggable="false"
             onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/ogaydv-prog/Microeconomics/master/pic-video.png';">
      </div>
      <div class="back">
        <a href="https://www.youtube.com/watch?v=7lMB1yGrRQ0" target="_blank" onclick="event.stopPropagation();">📺 Видеоурок 1</a>
        <a href="https://www.youtube.com/watch?v=iKvnFUW8WHQ" target="_blank" onclick="event.stopPropagation();">📺 Видеоурок 2</a>
        <a href="https://www.youtube.com/watch?v=AY1CuqkQMqc&list=PL4t_m8S_6E2BdsHD3G78-h2xhtauHUrIG&index=76" target="_blank" onclick="event.stopPropagation();">📺 Доп. разбор</a>
      </div>
    </div>
  </div>

  <script>
    const tile = document.getElementById('videoTile');
    tile.addEventListener('click', function() {
      this.classList.toggle('flipped');
    });
  </script>

</body>
</html>
